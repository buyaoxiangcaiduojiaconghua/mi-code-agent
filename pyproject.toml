[project]
name = "micodeagent"
version = "0.1.0"
description = "MiCodeAgent - 终端 AI 编程助手"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
    "rich>=13",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.scripts]
micodeagent = "micodeagent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"